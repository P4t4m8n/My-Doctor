<nav>
  <ul class="nav-list">
    @for(nav_route of nav_routes;track nav_route.label ) {
    <li>
      <a [routerLink]="nav_route.route">
        <ng-container
          [ngComponentOutlet]="nav_route.icon"
          [ngComponentOutletInputs]="{
            style: { width: '2rem', height: '2rem',  stroke: 'rgba(0, 0, 0, 0.75)' }
          }"
        >
        </ng-container>
        <p>
          {{ nav_route.label }}
        </p>
      </a>
    </li>
    }
  </ul>
</nav>
